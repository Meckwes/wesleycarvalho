      <text x="238" y="536" font-family="JetBrains Mono, monospace" font-size="8" letter-spacing=".8" fill="#64748B">HORAS</text>
      <text x="238" y="553" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#F8FAFC">21h</text>
      <rect x="382" y="520" width="148" height="40" rx="9" fill="#111827" stroke="#FFFFFF" stroke-opacity=".06"/>
      <text x="396" y="536" font-family="JetBrains Mono, monospace" font-size="8" letter-spacing=".8" fill="#64748B">PREVISTO</text>
      <text x="396" y="553" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#84CC16">R$ 450,00</text>
      <rect x="540" y="520" width="142" height="40" rx="9" fill="#111827" stroke="#FFFFFF" stroke-opacity=".06"/>
      <text x="554" y="536" font-family="JetBrains Mono, monospace" font-size="8" letter-spacing=".8" fill="#64748B">DEPOSITADO</text>
      <text x="554" y="553" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#84CC16">R$ 450,00</text>

      <rect x="66" y="570" width="616" height="20" rx="8" fill="#0F1626"/>
