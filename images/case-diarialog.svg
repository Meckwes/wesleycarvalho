      <text x="80" y="690" font-family="JetBrains Mono, monospace" font-size="8" letter-spacing=".8" fill="#64748B">TURNOS</text>
      <text x="80" y="707" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#F8FAFC">3</text>
      <rect x="224" y="674" width="148" height="40" rx="9" fill="#111827" stroke="#FFFFFF" stroke-opacity=".06"/>
      <text x="238" y="690" font-family="JetBrains Mono, monospace" font-size="8" letter-spacing=".8" fill="#64748B">HORAS</text>
      <text x="238" y="707" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#F8FAFC">24h</text>
      <rect x="382" y="674" width="148" height="40" rx="9" fill="#111827" stroke="#FFFFFF" stroke-opacity=".06"/>
      <text x="396" y="690" font-family="JetBrains Mono, monospace" font-size="8" letter-spacing=".8" fill="#64748B">PREVISTO</text>
      <text x="396" y="707" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#84CC16">R$ 520,00</text>
      <rect x="540" y="674" width="142" height="40" rx="9" fill="#111827" stroke="#FFFFFF" stroke-opacity=".06"/>
      <text x="554" y="690" font-family="JetBrains Mono, monospace" font-size="8" letter-spacing=".8" fill="#64748B">DEPOSITADO</text>
      <text x="554" y="707" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#64748B">—</text>

      <rect x="66" y="724" width="616" height="20" rx="8" fill="#0F1626"/>
      <text x="78" y="738" font-family="JetBrains Mono, monospace" font-size="9" fill="#64748B">sem conferência</text>
