      <text x="682" y="644" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#84CC16" text-anchor="end">R$ 520,00</text>
      <text x="66" y="661" font-family="JetBrains Mono, monospace" font-size="9.5" fill="#64748B">12 de out. — 18 de out.</text>

