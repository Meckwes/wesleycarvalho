      <text x="66" y="334" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" fill="#F8FAFC">Semana 44</text>
      <text x="146" y="334" font-family="JetBrains Mono, monospace" font-size="11" fill="#84CC16">2026-W44</text>
      <rect x="214" y="320" width="62" height="19" rx="9.5" fill="rgba(245,158,11,.14)"/>
      <text x="245" y="333.5" font-family="JetBrains Mono, monospace" font-size="9.5" fill="#FCD34D" text-anchor="middle">Previsto</text>
      <text x="682" y="336" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#84CC16" text-anchor="end">R$ 340,00</text>
      <text x="66" y="353" font-family="JetBrains Mono, monospace" font-size="9.5" fill="#64748B">26 de out. — 01 de nov.</text>

      <rect x="66" y="366" width="148" height="40" rx="9" fill="#111827" stroke="#FFFFFF" stroke-opacity=".06"/>
      <text x="80" y="382" font-family="JetBrains Mono, monospace" font-size="8" letter-spacing=".8" fill="#64748B">TURNOS</text>
      <text x="80" y="399" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#F8FAFC">2</text>
      <rect x="224" y="366" width="148" height="40" rx="9" fill="#111827" stroke="#FFFFFF" stroke-opacity=".06"/>
      <text x="238" y="382" font-family="JetBrains Mono, monospace" font-size="8" letter-spacing=".8" fill="#64748B">HORAS</text>
      <text x="238" y="399" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#F8FAFC">16h</text>
      <rect x="382" y="366" width="148" height="40" rx="9" fill="#111827" stroke="#FFFFFF" stroke-opacity=".06"/>
      <text x="396" y="382" font-family="JetBrains Mono, monospace" font-size="8" letter-spacing=".8" fill="#64748B">PREVISTO</text>
      <text x="396" y="399" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#84CC16">R$ 340,00</text>
