    <text x="48" y="286" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#F8FAFC">Resumo por semana</text>
    <text x="700" y="286" font-family="JetBrains Mono, monospace" font-size="10" fill="#64748B" text-anchor="end">repasse = semana seguinte</text>

    <!-- semana 44 -->
    <g>
