  <!-- ===== COLUNA DIREITA: CONFERÊNCIA + GRÁFICO ===== -->
  <g>
    <rect x="748" y="252" width="428" height="300" rx="16" fill="#111827" stroke="#FFFFFF" stroke-opacity=".07"/>
    <text x="772" y="286" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#F8FAFC">Previsto × depositado</text>
    <text x="1152" y="286" font-family="JetBrains Mono, monospace" font-size="10" fill="#64748B" text-anchor="end">tudo bate</text>

    <g stroke="#FFFFFF" stroke-opacity=".08">
      <line x1="790" y1="316" x2="1132" y2="316"/>
      <line x1="790" y1="352" x2="1132" y2="352"/>
      <line x1="790" y1="388" x2="1132" y2="388"/>
      <line x1="790" y1="424" x2="1132" y2="424"/>
    </g>
    <g font-family="JetBrains Mono, monospace" font-size="8.5" fill="#475569" text-anchor="end">
      <text x="778" y="320">R$ 520</text>
      <text x="778" y="356">R$ 390</text>
      <text x="778" y="392">R$ 260</text>
      <text x="778" y="428">R$ 130</text>
      <text x="778" y="464">R$ 0</text>
    </g>

    <!-- barras W44 -->
