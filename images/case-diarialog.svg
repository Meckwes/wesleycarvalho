  <!-- ===== CARD DE REGRAS ===== -->
  <g>
    <rect x="748" y="576" width="428" height="200" rx="16" fill="#111827" stroke="#FFFFFF" stroke-opacity=".07"/>
    <text x="772" y="610" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#F8FAFC">Regras de repasse</text>

    <g>
      <rect x="772" y="626" width="380" height="38" rx="10" fill="#151D2E"/>
      <circle cx="792" cy="645" r="4" fill="#84CC16"/>
      <text x="806" y="649" font-family="JetBrains Mono, monospace" font-size="9.5" fill="#94A3B8">semana trabalho <tspan fill="#F8FAFC">seg → dom</tspan></text>
    </g>
    <g>
      <rect x="772" y="672" width="380" height="38" rx="10" fill="#151D2E"/>
      <circle cx="792" cy="691" r="4" fill="#84CC16"/>
      <text x="806" y="695" font-family="JetBrains Mono, monospace" font-size="9.5" fill="#94A3B8">semana repasse <tspan fill="#F8FAFC">= trabalho + 1</tspan></text>
    </g>
    <g>
      <rect x="772" y="718" width="380" height="38" rx="10" fill="#151D2E"/>
      <circle cx="792" cy="737" r="4" fill="#84CC16"/>
      <text x="806" y="741" font-family="JetBrains Mono, monospace" font-size="9.5" fill="#94A3B8">janela <tspan fill="#F8FAFC">ter 00:00 → sex 22:00</tspan></text>
    </g>
  </g>

  <!-- rodapé do mockup -->
  <text x="24" y="790" font-family="JetBrains Mono, monospace" font-size="9" fill="#475569">100% client-side · funciona offline · dados não saem do aparelho</text>
</svg>
