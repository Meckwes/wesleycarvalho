      <rect x="812" y="424" width="30" height="40" rx="5" fill="url(#dl-bar)" opacity=".92"/>
      <rect x="846" y="464" width="30" height="0" rx="5" fill="#84CC16"/>
      <text x="844" y="490" font-family="JetBrains Mono, monospace" font-size="8.5" fill="#64748B" text-anchor="middle">W44</text>
    </g>
    <!-- barras W43 -->
    <g>
      <rect x="906" y="340" width="30" height="124" rx="5" fill="url(#dl-bar)" opacity=".92"/>
      <rect x="940" y="340" width="30" height="124" rx="5" fill="#F8FAFC" opacity=".22"/>
      <text x="938" y="490" font-family="JetBrains Mono, monospace" font-size="8.5" fill="#64748B" text-anchor="middle">W43</text>
    </g>
    <!-- barras W42 -->
    <g>
      <rect x="1000" y="316" width="30" height="148" rx="5" fill="url(#dl-bar)" opacity=".92"/>
      <rect x="1034" y="316" width="30" height="0" rx="5" fill="#F8FAFC" opacity=".2"/>
      <text x="1032" y="490" font-family="JetBrains Mono, monospace" font-size="8.5" fill="#64748B" text-anchor="middle">W42</text>
    </g>

    <g font-family="JetBrains Mono, monospace" font-size="8.5">
      <rect x="790" y="506" width="10" height="10" rx="3" fill="url(#dl-bar)"/>
      <text x="806" y="515" fill="#94A3B8">previsto</text>
      <rect x="880" y="506" width="10" height="10" rx="3" fill="#F8FAFC" opacity=".22"/>
      <text x="896" y="515" fill="#94A3B8">depositado</text>
    </g>
