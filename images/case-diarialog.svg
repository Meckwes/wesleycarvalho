      <rect x="44" y="612" width="660" height="142" rx="14" fill="#151D2E" stroke="#FFFFFF" stroke-opacity=".07"/>
      <text x="66" y="642" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" fill="#F8FAFC">Semana 42</text>
      <text x="146" y="642" font-family="JetBrains Mono, monospace" font-size="11" fill="#84CC16">2026-W42</text>
      <rect x="214" y="628" width="66" height="19" rx="9.5" fill="rgba(239,68,68,.14)"/>
