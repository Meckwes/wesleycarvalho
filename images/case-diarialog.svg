<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Interface do DiáriaLog com resumo semanal de turnos e repasses">
  <defs>
    <linearGradient id="dl-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B111F"/>
      <stop offset="100%" stop-color="#090D16"/>
    </linearGradient>
    <linearGradient id="dl-lime" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A3E635"/>
      <stop offset="100%" stop-color="#65A30D"/>
    </linearGradient>
    <linearGradient id="dl-bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#65A30D"/>
      <stop offset="100%" stop-color="#A3E635"/>
    </linearGradient>
    <radialGradient id="dl-halo" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#84CC16" stop-opacity=".16"/>
      <stop offset="100%" stop-color="#84CC16" stop-opacity="0"/>
    </radialGradient>
    <filter id="dl-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000" flood-opacity=".45"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#dl-bg)"/>
  <rect width="1200" height="800" fill="url(#dl-halo)"/>

  <!-- ===== APP BAR ===== -->
  <g>
    <rect x="0" y="0" width="1200" height="56" fill="#0D1421"/>
    <rect x="0" y="55.5" width="1200" height="1" fill="#FFFFFF" opacity=".08"/>
    <rect x="24" y="14" width="28" height="28" rx="8" fill="url(#dl-lime)"/>
    <text x="38" y="33" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="800" fill="#090D16" text-anchor="middle">DL</text>
    <text x="62" y="33" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" fill="#F8FAFC">DiáriaLog</text>
    <text x="142" y="33" font-family="JetBrains Mono, monospace" font-size="10" fill="#64748B">turnos · horas · repasses</text>
    <rect x="1012" y="16" width="164" height="24" rx="12" fill="#111827" stroke="#FFFFFF" stroke-opacity=".1"/>
    <circle cx="1028" cy="28" r="3.5" fill="#84CC16"/>
    <text x="1040" y="32" font-family="JetBrains Mono, monospace" font-size="9.5" fill="#94A3B8">LocalStorage</text>
  </g>

  <!-- ===== KPI ROW ===== -->
  <g>
    <g>
      <rect x="24" y="80" width="272" height="92" rx="14" fill="#111827" stroke="#FFFFFF" stroke-opacity=".07"/>
      <text x="44" y="106" font-family="JetBrains Mono, monospace" font-size="9" letter-spacing="1.4" fill="#64748B">TOTAL PREVISTO</text>
      <text x="44" y="140" font-family="Inter, system-ui, sans-serif" font-size="25" font-weight="700" fill="#F8FAFC">R$ 1.310,00</text>
      <text x="44" y="159" font-family="JetBrains Mono, monospace" font-size="9.5" fill="#64748B">8 turno(s) · 61.0h</text>
    </g>
    <g>
      <rect x="312" y="80" width="272" height="92" rx="14" fill="#111827" stroke="#FFFFFF" stroke-opacity=".07"/>
      <text x="332" y="106" font-family="JetBrains Mono, monospace" font-size="9" letter-spacing="1.4" fill="#64748B">A RECEBER</text>
      <text x="332" y="140" font-family="Inter, system-ui, sans-serif" font-size="25" font-weight="700" fill="#84CC16">R$ 860,00</text>
      <text x="332" y="159" font-family="JetBrains Mono, monospace" font-size="9.5" fill="#64748B">ainda não depositado</text>
    </g>
    <g>
      <rect x="600" y="80" width="272" height="92" rx="14" fill="#111827" stroke="#FFFFFF" stroke-opacity=".07"/>
      <text x="620" y="106" font-family="JetBrains Mono, monospace" font-size="9" letter-spacing="1.4" fill="#64748B">JÁ RECEBIDO</text>
      <text x="620" y="140" font-family="Inter, system-ui, sans-serif" font-size="25" font-weight="700" fill="#60A5FA">R$ 450,00</text>
      <text x="620" y="159" font-family="JetBrains Mono, monospace" font-size="9.5" fill="#64748B">conferência de depósitos</text>
    </g>
    <g>
      <rect x="888" y="80" width="288" height="92" rx="14" fill="#111827" stroke="#FFFFFF" stroke-opacity=".07"/>
      <text x="908" y="106" font-family="JetBrains Mono, monospace" font-size="9" letter-spacing="1.4" fill="#64748B">PRÓXIMO REPASSE</text>
      <text x="908" y="140" font-family="Inter, system-ui, sans-serif" font-size="25" font-weight="700" fill="#FB923C">03 de nov.</text>
      <text x="908" y="159" font-family="JetBrains Mono, monospace" font-size="9.5" fill="#64748B">até 06 de nov. 22:00</text>
    </g>
  </g>

  <!-- ===== TABS ===== -->
  <g>
    <rect x="24" y="192" width="1152" height="40" rx="12" fill="#111827" stroke="#FFFFFF" stroke-opacity=".07"/>
    <rect x="32" y="198" width="300" height="28" rx="9" fill="#1B2436"/>
    <text x="182" y="216" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#F8FAFC" text-anchor="middle">Turnos</text>
    <text x="470" y="216" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#94A3B8" text-anchor="middle">Semanas</text>
    <text x="758" y="216" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#94A3B8" text-anchor="middle">Conferência</text>
